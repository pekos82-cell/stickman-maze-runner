<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Stickman Maze Runner</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <main id="app">

        <section id="menu">

            <h1>Stickman Maze Runner</h1>

            <p class="subtitle">
                Run. Turn. Block. Win.
            </p>

            <input
                id="nickname"
                type="text"
                maxlength="16"
                placeholder="Nickname (optional)"
            >

            <button id="createRoom">
                Create Game
            </button>

            <div class="join">

                <input
                    id="roomCode"
                    maxlength="4"
                    placeholder="ROOM CODE"
                >

                <button id="joinRoom">
                    Join Game
                </button>

            </div>

            <p id="error"></p>

        </section>

        <section
            id="lobby"
            class="hidden"
        >

            <h2>Game Lobby</h2>

            <div>
                Room:
                <strong id="roomDisplay"></strong>
            </div>

            <div id="players"></div>

            <button id="startGame">
                START RACE
            </button>

        </section>

        <section
            id="game"
            class="hidden"
        >

            <header>

                <div>
                    Room:
                    <strong id="gameRoom"></strong>
                </div>

                <div>
                    Barricades:
                    <strong id="barricades">
                        3
                    </strong>
                </div>

            </header>

            <canvas id="gameCanvas"></canvas>

            <div
                id="directionControls"
                class="direction-controls"
            >

                <button data-direction="up">
                    ▲
                </button>

                <div>

                    <button data-direction="left">
                        ◀
                    </button>

                    <button data-direction="down">
                        ▼
                    </button>

                    <button data-direction="right">
                        ▶
                    </button>

                </div>

            </div>

            <div id="ranking"></div>

        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>

    <script
        src="/js/network.js"
        defer
    ></script>

    <script
        src="/js/renderer.js"
        defer
    ></script>

    <script
        src="/js/controls.js"
        defer
    ></script>

    <script
        src="/js/ui.js"
        defer
    ></script>

    <script
        src="/js/main.js"
        defer
    ></script>

</body>

</html>
